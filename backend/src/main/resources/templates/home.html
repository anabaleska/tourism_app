<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tourism Places</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="theme-page home-page">
<div class="page-shell">
    <div th:replace="fragments/topbars :: site-header"></div>

    <main class="page-content">
        <section class="home-hero">
            <div class="container">
                <h1>Say "Halo" to Ohrid &amp; Struga!</h1>
                <p>Explore places you can visit in Ohrid, Struga or both!</p>
                <span class="hero-badge" th:if="${totalPlaces != null}" th:text="${totalPlaces} + ' places'">0 places</span>
            </div>
        </section>

        <div class="container py-4">
            <div class="section-heading">
                <h2 class="section-title">Explore Places</h2>
                <span class="section-pill" th:if="${totalPlaces != null}" th:text="${totalPlaces} + ' places'">0 places</span>
            </div>

            <div class="alert alert-info" th:if="${places == null or #lists.isEmpty(places)}">
                <i class="bi bi-info-circle me-1"></i>
                No places found right now.
            </div>

            <!-- Places Grid -->
            <div class="places-grid" th:if="${places != null and !#lists.isEmpty(places)}">
                <th:block th:each="place : ${places}">
                    <div th:if="${place != null}" class="place-card-wrapper">
                        <div th:replace="~{fragments/placeBox :: placeBox(${place})}"></div>
                    </div>
                </th:block>
            </div>

            <!-- Pagination Controls -->
            <div th:if="${totalPages != null and totalPages > 1}">
                <div class="pagination-info">
                    Page <span th:text="${currentPage}">1</span> of <span th:text="${totalPages}">1</span>
                </div>

                <nav aria-label="Page navigation" class="pagination-container">
                    <!-- Previous Button -->
                    <a th:if="${currentPage > 1}" th:href="@{/(page=${currentPage - 1})}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-chevron-left"></i> Previous
                    </a>
                    <span th:if="${currentPage == 1}" class="btn btn-outline-primary btn-sm disabled">
                        <i class="bi bi-chevron-left"></i> Previous
                    </span>

                    <!-- Page Numbers -->
                    <div class="d-flex gap-1 flex-wrap justify-content-center">
                        <th:block th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
                            <a th:if="${pageNum != currentPage}" th:href="@{/(page=${pageNum})}" class="btn btn-outline-secondary btn-sm" th:text="${pageNum}">1</a>
                            <span th:if="${pageNum == currentPage}" class="btn btn-primary btn-sm active" th:text="${pageNum}">1</span>
                        </th:block>
                    </div>

                    <!-- Next Button -->
                    <a th:if="${currentPage < totalPages}" th:href="@{/(page=${currentPage + 1})}" class="btn btn-outline-primary btn-sm">
                        Next <i class="bi bi-chevron-right"></i>
                    </a>
                    <span th:if="${currentPage == totalPages}" class="btn btn-outline-primary btn-sm disabled">
                        Next <i class="bi bi-chevron-right"></i>
                    </span>
                </nav>
            </div>
        </div>
    </main>

    <div class="modal fade"
         id="interactionModal"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow">

                <div class="modal-header">
                    <div>
                        <p class="text-uppercase small text-muted mb-1">
                            Place interaction
                        </p>

                        <h5 class="modal-title mb-0"
                            id="modalPlaceName">
                            Place
                        </h5>
                    </div>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <form id="interactionForm" method="post">

                    <div class="modal-body">

                        <div class="p-3 rounded-4 bg-light border mb-3">

                            <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted fw-semibold">
                                Current average interaction
                            </span>

                                <span class="badge text-bg-primary rounded-pill">
                                Live
                            </span>
                            </div>

                            <div class="display-6 fw-bold mb-0 text-primary"
                                 id="modalAverageInteraction">
                                0.0
                            </div>

                            <div class="small text-muted mt-2"
                                 id="modalCurrentInteraction">
                            </div>

                        </div>

                        <input type="hidden"
                               name="placeId"
                               id="modalPlaceId">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Interaction
                            </label>

                            <input type="number"
                                   class="form-control form-control-lg rounded-pill"
                                   id="modalInteractionInput"
                                   name="interaction"
                                   min="1"
                                   step="1"
                                   required>
                        </div>

                    </div>

                    <div class="modal-footer border-0 pt-0">

                        <button type="button"
                                class="btn btn-outline-secondary rounded-pill px-4"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit"
                                id="modalSubmitButton"
                                class="btn btn-success rounded-pill px-4">
                            Submit
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <div th:replace="fragments/topbars :: site-footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {

        const form = document.getElementById('interactionForm');
        const placeName = document.getElementById('modalPlaceName');
        const placeId = document.getElementById('modalPlaceId');
        const average = document.getElementById('modalAverageInteraction');
        const current = document.getElementById('modalCurrentInteraction');
        const interactionInput = document.getElementById('modalInteractionInput');
        const submitBtn = document.getElementById('modalSubmitButton');

        document.addEventListener('click', e => {

            const btn = e.target.closest('.interaction-btn');

            if (!btn) {
                return;
            }

            placeName.textContent =
                btn.dataset.placeName || '';

            placeId.value =
                btn.dataset.placeId || '';

            average.textContent =
                btn.dataset.average || '0.0';

            interactionInput.value =
                btn.dataset.currentInteraction || '';

            form.action =
                btn.dataset.action;

            if (btn.dataset.currentInteraction) {

                current.innerHTML =
                    'Your current interaction: <strong>' +
                    btn.dataset.currentInteraction +
                    '</strong>';

            } else {

                current.textContent =
                    'You have not added an interaction for this place yet.';
            }

            if (btn.dataset.mode === 'update') {

                submitBtn.textContent =
                    'Update interaction';

                submitBtn.className =
                    'btn btn-warning rounded-pill px-4';

            } else {

                submitBtn.textContent =
                    'Add interaction';

                submitBtn.className =
                    'btn btn-success rounded-pill px-4';
            }
        });
    });
</script>
</body>
</html>
