<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tourism Places</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Explore Places</h1>
        <span class="badge text-bg-dark" th:if="${places != null}" th:text="${#lists.size(places)} + ' places'">0 places</span>
    </div>

    <div class="alert alert-info" th:if="${places == null or #lists.isEmpty(places)}">
        <i class="bi bi-info-circle me-1"></i>
        No places found right now.
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" th:if="${places != null and !#lists.isEmpty(places)}">
        <th:block th:each="place : ${places}">
            <div th:if="${place != null}" th:replace="~{fragments/placeBox :: placeBox(${place})}"></div>
        </th:block>
    </div>
</div>

</body>
</html>
