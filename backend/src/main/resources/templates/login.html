<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login | ParentHive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/styleTopBarSideBar.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

</head>
<body class="auth-page">

<!-- Header fragment -->
<!--<div th:replace="fragments/topbars :: topbar-guest"></div>-->

<!-- Main content -->
<div class="auth-layout">
    <section class="auth-hero">
        <div class="auth-brand">
            <div class="auth-brand-mark">A</div>
            <span>TourismAPP</span>
        </div>
        <div>
            <h1>Say "Halo" to Ohrid &amp; Struga!</h1>
            <p>Explore places you can visit in Ohrid, Struga or both!</p>
        </div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <h2 class="auth-title">Welcome back, traveler!</h2>

            <form class="auth-form" th:action="@{/login}" method="post" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="username">username</label>
                    <input type="text" class="auth-input" id="username" name="username" placeholder="Username" required>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="password">password</label>
                    <input type="password" class="auth-input" id="password" name="password" placeholder="Password" required>
                </div>

                <div th:if="${param.error}" class="auth-error" th:text="'Incorrect Email or Password'"></div>
                <div th:if="${successMessage}" class="auth-success" th:text="${successMessage}"></div>

                <button class="auth-button" type="submit">Login</button>

                <div class="auth-footer">
                    New traveler? <a href="/register">Register</a>
                </div>
            </form>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
