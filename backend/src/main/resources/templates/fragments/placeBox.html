<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="placeBox(place)"
     class="col h-100"
     th:if="${place != null}"
     th:with="
        placeId=${place.id != null ? place.id : ''},
        placeName=${place.name != null ? place.name : ''},
        placeCategory=${place.category != null ? place.category : ''},
        placeType=${place.type != null ? place.type : ''},
        placeArea=${place.place != null ? place.place : ''},
        placeMunicipality=${place.municipality != null ? place.municipality : ''},
        placeDescription=${place.description != null ? place.description : ''},
        placeImageUrl=${place.imageUrl != null ? place.imageUrl : ''},
        placeRating=${place.rating != null ? place.rating : null},
        placePrice=${place.price != null ? place.price : null},
        placeTimeToVisit=${place.timeToVisit != null ? place.timeToVisit : null}">

    <article class="card h-100 shadow-sm border-0 tourism-place-card">

        <div class="position-relative">

            <img th:if="${placeImageUrl != ''}"
                 th:src="${placeImageUrl}"
                 th:alt="${placeName}"
                 class="card-img-top"
                 style="height: 220px; object-fit: cover;"/>

            <div th:if="${placeImageUrl == ''}"
                 class="d-flex align-items-center justify-content-center bg-light text-secondary"
                 style="height: 220px;">
                <div class="text-center">
                    <i class="bi bi-image fs-1"></i>
                    <div>No image available</div>
                </div>
            </div>

        </div>

        <div class="card-body d-flex flex-column">

            <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                <h5 class="card-title mb-0 text-truncate"
                    th:text="${placeName}">
                    Place name
                </h5>

                <span class="badge text-bg-warning"
                      th:if="${placeRating != null}">
                    <i class="bi bi-star-fill me-1"></i>
                    <span th:text="${#numbers.formatDecimal(placeRating, 1, 1)}">4.5</span>
                </span>
            </div>

            <div class="mb-2 d-flex flex-wrap gap-2">
                <span class="badge text-bg-primary"
                      th:if="${placeCategory != ''}"
                      th:text="${placeCategory}">
                    Category
                </span>

                <span class="badge text-bg-secondary"
                      th:if="${placeType != ''}"
                      th:text="${placeType}">
                    Type
                </span>
            </div>

            <p class="text-muted small mb-2"
               th:if="${placeArea != '' or placeMunicipality != ''}">
                <i class="bi bi-geo-alt me-1"></i>

                <span th:text="${placeArea != '' ? placeArea : ''}">
                    Place
                </span>

                <span th:if="${placeArea != '' and placeMunicipality != ''}">
                    ,
                </span>

                <span th:text="${placeMunicipality != '' ? placeMunicipality : ''}">
                    Municipality
                </span>
            </p>

            <p class="card-text place-card-description mb-3"
               th:if="${placeDescription != ''}"
               th:text="${placeDescription}">
                Description
            </p>

            <p class="card-text place-card-description mb-3 text-muted"
               th:if="${placeDescription == ''}">
                No description available.
            </p>

            <div class="mt-auto small text-muted d-flex flex-column gap-1">

                <div class="fw-semibold text-dark">
                    <i class="bi bi-graph-up-arrow me-1 text-primary"></i>
                    Average interaction:
                    <span class="text-primary"
                          th:text="${#numbers.formatDecimal(@interactionServiceImpl.averageInteraction(placeId), 1, 1)}">
                        0.0
                    </span>
                </div>

                <div th:if="${placePrice != null}">
                    <i class="bi bi-cash-coin me-1"></i>
                    Price level:
                    <span th:text="${placePrice}">0</span>
                </div>

                <div th:if="${placeTimeToVisit != null}">
                    <i class="bi bi-clock me-1"></i>
                    Visit time:
                    <span th:text="${placeTimeToVisit}">0</span> min
                </div>

                <div th:if="${userInteractions != null and userInteractions.get(placeId) != null}">
                    <i class="bi bi-hash me-1"></i>
                    Your interaction:
                    <span th:text="${userInteractions.get(placeId)}">UUID</span>
                </div>

            </div>

            <div class="d-flex flex-wrap gap-2 mt-3">

                <a class="btn btn-outline-primary btn-sm flex-grow-1"
                   th:href="@{/places/{id}(id=${place.id})}">
                    <i class="bi bi-box-arrow-up-right me-1"></i>
                    View details
                </a>

            </div>

        </div>

    </article>

</div>

</body>
</html>
