<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="site-header">
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" th:href="@{/home}">
                <span class="site-brand-mark">V</span>
                <span>BrandName</span>
            </a>

            <nav class="site-nav">
                <a th:href="@{/home}">Home</a>
                <a th:href="@{/ohrid}">Ohrid</a>
                <a th:href="@{/struga}">Struga</a>
                <a th:href="@{/favorites}">Favorites</a>
            </nav>

            <div class="site-actions">
                <form class="site-search" role="search" method="get">
                    <i class="bi bi-search"></i>
                    <input type="search" name="search" placeholder="Search places">
                    <button type="submit">Search</button>
                </form>
                <a class="profile-link" th:href="@{/profile}">
                    <span class="profile-badge"><i class="bi bi-person-fill"></i></span>
                </a>
            </div>
        </div>
    </header>
</div>

<div th:fragment="site-footer">
    <footer class="site-footer">
        <div class="site-footer__inner">
            <div class="site-footer__brand">
                <div class="site-brand">
                    <span class="site-brand-mark">V</span>
                    <span>BrandName</span>
                </div>
                <p>Explore Ohrid and Struga with curated favorites.</p>
            </div>

            <div class="site-footer__links">
                <a th:href="@{/home}">Home</a>
                <a th:href="@{/ohrid}">Ohrid</a>
                <a th:href="@{/struga}">Struga</a>
                <a th:href="@{/favorites}">Favorites</a>
            </div>

            <div class="site-footer__meta">© 2026 BrandName. All rights reserved.</div>
        </div>
    </footer>
</div>
</body>
</html>
