<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Register | ParentHive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/styleTopBarSideBar.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <style>
        .image-side {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQliLPHr-6ZmJCPRrHPPNoBDsjhg3Lp5J3hdg&s');
            background-size: cover;
            background-position: center;
            height: 100vh;
        }

        .full-height {
            min-height: 100vh;
        }

        .form-wrapper {
            max-width: 480px;
            width: 100%;
        }

        .required::after {
            content: "*";
            color: red;
            margin-left: 4px;
        }

        #proFields {
            display: none;
        }
    </style>
</head>
<body>

<!-- Topbar Fragment -->
<!--<div th:replace="fragments/topbars :: topbar-guest"></div>-->

<!-- Main Layout -->
<div class="container-fluid">
    <div class="row full-height">

        <!-- Left Side: Form (2/5) -->
        <div class="col-md-5 d-flex align-items-center justify-content-center bg-white">
            <div class="form-wrapper p-4">

                <h4 class="mb-4 text-center">Join the Hive – Let's Raise Them Together!</h4>

                <form th:action="@{/register}" th:object="${registrationForm}" method="post" enctype="multipart/form-data" novalidate>

                    <!-- Username -->
                    <div class="form-floating mb-3">
                        <input type="text" id="username" class="form-control" placeholder="Username" th:field="*{username}" required />
                        <label for="username">Username</label>
                        <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <!-- Email -->
                    <div class="form-floating mb-3">
                        <input type="email" id="email" class="form-control" placeholder="Email" th:field="*{email}" required />
                        <label for="email">Email</label>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- Password -->
                    <div class="form-floating mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password" th:field="*{password}" required />
                        <label for="password">Password</label>
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-floating mb-3">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" th:field="*{confirmPassword}" required />
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>

                    <!-- Submit -->
                    <button class="btn btn-warning w-100 mt-3 text-white" type="submit" style="background-color: #FF6600;">
                        Register
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Side: Image (3/5) -->
        <div class="col-md-7 d-none d-md-block image-side"></div>
    </div>

    <!-- Parent Registration Success Modal -->
    <div class="modal fade" id="parentSuccessModal" tabindex="-1" aria-labelledby="parentSuccessModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="parentSuccessModalLabel">Welcome to ParentHive!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <h4>You have successfully joined the hive as a parent bee!</h4>
                    <p>You will be redirected to the login page shortly...</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script th:if="${showParentSuccessModal == true}">
    const parentSuccessModal = new bootstrap.Modal(document.getElementById('parentSuccessModal'));
    parentSuccessModal.show();

    // Redirect to login after 3 seconds
    setTimeout(() => {
        window.location.href = '/login';
    }, 5000);
</script>


</body>
</html>
