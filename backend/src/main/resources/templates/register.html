<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Register | ParentHive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/styleTopBarSideBar.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</head>
<body class="auth-page">

<!-- Topbar Fragment -->
<!--<div th:replace="fragments/topbars :: topbar-guest"></div>-->

<!-- Main Layout -->
<div class="auth-layout">
    <section class="auth-hero">
        <div class="auth-brand">
            <div class="auth-brand-mark">A</div>
            <span>TourismAPP</span>
        </div>
        <div>
            <h1>Say "Halo" to Ohrid &amp; Struga!</h1>
            <p>Explore places you can visit in Ohrid, Struga or both!</p>
        </div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <h2 class="auth-title">New traveler? Register here!</h2>

            <form class="auth-form" th:action="@{/register}" th:object="${registrationForm}" method="post" enctype="multipart/form-data" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="email">email address</label>
                    <input type="email" id="email" class="auth-input" placeholder="Email" th:field="*{email}" required />
                    <div class="auth-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="username">username</label>
                    <input type="text" id="username" class="auth-input" placeholder="Username" th:field="*{username}" required />
                    <div class="auth-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="password">password</label>
                    <input type="password" id="password" class="auth-input" placeholder="Password" th:field="*{password}" required />
                    <div class="auth-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="confirmPassword">confirm password</label>
                    <input type="password" id="confirmPassword" class="auth-input" placeholder="Confirm Password" th:field="*{confirmPassword}" required />
                    <div class="auth-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button class="auth-button" type="submit">Register</button>

                <div class="auth-footer">
                    Existing traveler? <a href="/login">Login</a>
                </div>
            </form>
        </div>
    </section>
</div>

<!-- Parent Registration Success Modal -->
<div class="modal fade" id="parentSuccessModal" tabindex="-1" aria-labelledby="parentSuccessModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="parentSuccessModalLabel">Welcome to ParentHive!</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <h4>You have successfully joined the hive as a parent bee!</h4>
                <p>You will be redirected to the login page shortly...</p>
            </div>
        </div>
    </div>
</div>

<script th:if="${showParentSuccessModal == true}">
    const parentSuccessModal = new bootstrap.Modal(document.getElementById('parentSuccessModal'));
    parentSuccessModal.show();

    // Redirect to login after 3 seconds
    setTimeout(() => {
        window.location.href = '/login';
    }, 5000);
</script>


</body>
</html>
