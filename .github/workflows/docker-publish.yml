name: Test and publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: TourismCI2026
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Check application and recommendation endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8080/login > /dev/null
          python3 - <<'PY'
          import json
          import urllib.request
          checks = {
              'http://localhost:8000/': {'message': 'Recommendation service running'},
              'http://localhost:8000/recommend?place_id=ci-missing-place': {'recommendations': []},
              'http://localhost:8000/recommend_collab?user_id=ci-missing-user': {'recommendations': []},
          }
          for url, expected in checks.items():
              with urllib.request.urlopen(url, timeout=10) as response:
                  actual = json.load(response)
              assert actual == expected, (url, actual)
          PY

      - name: Show diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Clean up CI containers
        if: always()
        run: docker compose down --volumes

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./backend
            image: blazheskamarijaa/tourism-backend
          - context: ./recommendation-service
            image: blazheskamarijaa/tourism-recommendations
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
