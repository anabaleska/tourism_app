apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tourism-app
  namespace: tourism-app
spec:
  ingressClassName: traefik
  rules:
    - host: tourism.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080