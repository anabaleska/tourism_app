apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: tourism-app
data:
  SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/tourism_app_db'
  SPRING_DATASOURCE_USERNAME: 'tourismAppDb'
  RECOMMENDATION_SERVICE_BASE_URL: 'http://recommendations:8000'
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tourism-app
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tourism-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: blazheskamarijaa/tourism-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3